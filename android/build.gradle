group = "ru.kls.kinescope_android_player"
version = "1.0-SNAPSHOT"

buildscript {
    ext.kotlin_version = "1.9.24"

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }

    dependencies {
        classpath "com.android.tools.build:gradle:8.2.2"
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url "https://jitpack.io" }
    }

    // =========================================================
    // PROTOBUF CONFLICT FIX
    //
    // flutter_reactive_ble запрашивает:
    // protobuf-javalite:3.25.3
    //
    // Kinescope запрашивает:
    // protobuf-java:3.25.3
    //
    // Оба содержат одинаковые com.google.protobuf.* классы,
    // поэтому Android получает Duplicate class.
    //
    // Вместо удаления Protobuf унифицируем runtime:
    // запрос javalite 3.25.3 заменяем на protobuf-java 3.25.3.
    //
    // Таким образом:
    // - Kinescope остаётся на protobuf-java;
    // - BLE остаётся установленным;
    // - в APK попадает только одна реализация Protobuf.
    // =========================================================

    configurations.configureEach {
        resolutionStrategy.eachDependency { details ->
            if (
                details.requested.group == "com.google.protobuf" &&
                details.requested.name == "protobuf-javalite" &&
                details.requested.version == "3.25.3"
            ) {
                details.useTarget(
                    "com.google.protobuf:protobuf-java:3.25.3"
                )
            }
        }
    }
}

apply plugin: "com.android.library"
apply plugin: "kotlin-android"

android {
    namespace = "ru.kls.kinescope_android_player"

    compileSdk = 35

    defaultConfig {
        minSdk = 23

        consumerProguardFiles "proguard-rules.pro"
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:$kotlin_version"

    // =========================================================
    // KINESCOPE
    //
    // Версию пока НЕ меняем.
    // =========================================================

    implementation "com.github.kinescope:kotlin-kinescope-player:0.1.1"

    // =========================================================
    // MEDIA3
    //
    // Наш KlsKinescopePlayerView.kt напрямую использует:
    //
    // androidx.media3.common.Player
    // androidx.media3.exoplayer.ExoPlayer
    //
    // Kinescope 0.1.1 использует Media3 1.8.0,
    // поэтому ставим ту же версию.
    // =========================================================

    implementation "androidx.media3:media3-common:1.8.0"

    implementation "androidx.media3:media3-exoplayer:1.8.0"

    // =========================================================
    // LIFECYCLE
    //
    // Для LifecycleOwner / DefaultLifecycleObserver.
    // =========================================================

    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.8.7"
}
